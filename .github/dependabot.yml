# Dependabot version updates (#586). Security updates are a separate repository
# setting ("Dependabot security updates"), which a file cannot turn on; the
# `security` groups below only say how those arrive.
#
# The aim is few pull requests: at most one per group per week, not one per
# package. A dependency goes into the first group that takes it, so the order
# of the groups matters.
#
#   npm (the root, which covers the `ui` workspace through the one root
#   lockfile; the site; the feedback function), one entry for all three, so a
#   package bumped in two of them is one pull request:
#     security  every security update
#     shipped   minor and patch updates of what reaches a user: what esbuild
#               folds into dist/toil-lib.js, the libraries Toil UI's front end
#               and the site's pages are built from, and the deployed
#               function's runtime
#     tooling   minor and patch updates of everything else
#     majors    every major update, of anything
#
#   github-actions: one pull request for every action, majors included, and
#   one for its security updates.
#
# `shipped` is a list, and a package missing from it is not lost: it arrives
# with `tooling`. Add a new bundled dependency here so its bump is reviewed as
# something users get.
#
# A grouped pull request passes or fails as one. To take the rest without one
# package, comment `@dependabot ignore <package> major version` (or `minor`,
# `patch`) on it.
#
# Every npm version update waits 14 days after a release (CLAUDE.md, Secrets:
# the 14-day rule). A cooldown never applies to a security update, so a patched
# release younger than 14 days may still arrive; the review decides whether to
# take it early.

version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /site
      - /functions/feedback
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    ignore:
      # @types/node follows the Node floor (engines), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      shipped:
        patterns:
          # Bundled into the published package (dist/toil-lib.js).
          - '@cfworker/json-schema'
          - '@modelcontextprotocol/sdk'
          - 'ajv*'
          - 'commander'
          - 'fast-uri'
          - 'hive-driver'
          - 'js-yaml'
          - 'mysql2'
          - 'oracledb'
          - 'pg'
          - 'pg-*'
          - 'tedious'
          - 'thrift'
          - 'zod'
          # Built into Toil UI's front end (ui/dist/app) and the site's pages.
          - '@dnd-kit/*'
          - '@fontsource/*'
          - '@xyflow/react'
          - 'react'
          - 'react-aria-components'
          - 'react-dom'
          # The feedback function's runtime, which is deployed.
          - '@azure/*'
        update-types:
          - minor
          - patch
      tooling:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      majors:
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Workflows pin every action to a commit SHA with its version in a comment
    # (the automation skill); Dependabot updates both. No cooldown here: the
    # 14-day rule is about npm packages, and an action update is read at its SHA.
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
      actions:
        patterns:
          - '*'
