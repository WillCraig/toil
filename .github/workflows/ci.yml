name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests and main run toil's gate and Toil UI's side by side on Linux,
  # on the supported Node floor (Toil UI's is its checks and its eight layout
  # shards, which a docs-and-config PR skips, see `changes`), and both gates on
  # Windows, macOS and Node 26 beside them (`platforms`, below), with the
  # layout check left to Linux. The full layout check on every OS runs daily
  # (platforms.yml). Every job has a time limit, so a hang fails in minutes,
  # not at GitHub's six hours. The floor was 24.14, the first
  # release where both the OS certificate store and the proxy env vars can be
  # switched on from code (tls.setDefaultCACertificates,
  # http.setGlobalProxyFromEnv); it is now 24.22.1, the 24.x release patched for
  # CVE-2026-111497 (#479). Keep it in step with "engines" in package.json, with
  # src/core/runtime.ts and with platforms.yml.
  gate:
    name: toil gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      # Install scripts stay off even for the dev toolchain.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # No runtime deps, no install scripts, only Node built-ins, no spawning.
      - run: npm run check:pure
      # On the release PR only, which rebuilds the committed dist/toil.js
      # (release.yml): it is exactly what the build just produced. `platforms`
      # checks the same on every OS. Every other PR leaves dist/ alone (dist-guard).
      - if: startsWith(github.head_ref, 'release-please--')
        run: npm run check:dist
      # Install the packed tarball with scripts off; drive the CLI and MCP.
      # Then clone the checkout and run the build from the clone, no install.
      - run: npm run smoke

  # Whether this PR needs the long jobs below (Toil UI's gate, the database job).
  # A PR that changes only docs and config skips them; toil's gate above runs on
  # every PR. The list lives in scripts/ci-scope.mjs, and this runs main's copy
  # of it, so a PR can't widen it for itself; a PR that adds or changes the
  # script runs everything. A push to main runs everything. The maintainer's
  # call, 2026-11-16.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Only a PR against main may skip: a PR stacked on another branch could be
        # pointed at main later without CI running again. --no-renames lists both
        # sides of a move, so a file moved out of a path the jobs read still counts.
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" != "main" ] || ! git show "$BASE_SHA:scripts/ci-scope.mjs" > "$RUNNER_TEMP/ci-scope.mjs" 2>/dev/null; then
            echo "Running everything: not a pull request against main, or main has no scope list yet."
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed"; then
            echo "Running everything: the changed paths couldn't be listed."
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "$RUNNER_TEMP/ci-scope.mjs" "$RUNNER_TEMP/changed" >> "$GITHUB_OUTPUT"

  # Toil UI (ui/, @imagile-dev/toil-ui), the root's npm workspace: never in
  # toil's tarball, but held to the same gate. check:package is its check:pure
  # (one dependency, toil pinned exactly, no install scripts, no native addon,
  # the server imports only built-ins and toil, a tarball allowlist). Its smoke
  # runs in ui-layout below, beside this job.
  ui:
    name: Toil UI checks
    needs: [changes]
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      # toil's build writes the generated sources (src/*.generated.ts) that Toil UI imports.
      - run: npm run build
      - run: npm run typecheck -w ui
      - run: npm run lint -w ui
      - run: npm test -w ui
      - run: npm run build -w ui
      - run: npm run check:package -w ui
      # The toil npm ci installed for Toil UI is the one ui/package.json pins
      # (#299), on every PR, the release PR too. The state a release leaves, the
      # new pin over the previous toil's tarball, passes with a warning until
      # release.yml's lockfile PR merges (ui/scripts/package-rules.mjs, lockfileLag).
      - run: npm run check:lockfile -w ui

  # Toil UI's smoke, in eight jobs side by side (#640). Each installs both
  # tarballs offline, opens the UI and runs its security checks, holds its
  # eighth of the layout check to the runner's Chrome
  # (ui/scripts/layout-check.mjs), one Chrome per core, then runs the live and
  # wipe checks. A unit of the layout check is one theme
  # scheme on one view, and shard k takes every unit whose count modulo 8 is
  # k - 1, so a new theme or view lands in a shard by existing. Run as one job
  # the layout check took about 42 minutes. Each shard builds its own tarballs
  # from the same commit, which takes seconds, rather than wait on a build job
  # and an artifact. platforms.yml runs the whole smoke unsharded on every OS,
  # daily. fail-fast is off so one round shows every shard's problems.
  ui-layout:
    name: Toil UI layout (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes]
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      # The UI's smoke installs toil's packed tarball and its own, so both are built first.
      - run: npm run build
      - run: npm run build -w ui
      # strategy.job-total is the matrix's length, so N is said once, in the list.
      - run: npm run smoke -w ui -- --include-tests layout:${{ matrix.shard }}/${{ strategy.job-total }}

  # Windows and macOS on both supported Node lines, and Linux on Node 26: every
  # OS is first-class (principle 8), so a break on one blocks the merge like a
  # break on Linux does. Both gates run here, toil's and Toil UI's, but Toil
  # UI's smoke runs with --include-tests none: the install, the server's gates, the live
  # store and the wipe, the parts most tied to the OS. The layout check stays in
  # ui-layout on Linux on every PR and runs on every OS daily (platforms.yml):
  # fonts and scrollbars do differ by OS, so this is a trade of cost for a day's
  # delay, not a claim that they render alike. One job per OS and Node keeps a
  # run's peak at about 18 jobs, inside GitHub Free's 20 at once (5 macOS),
  # though two runs at once share that limit and queue. Toil UI's steps follow
  # the scope check, like the jobs above; toil's run whenever it passed.
  # Lint and check:lockfile read the same files on every OS, so they stay on
  # Linux. The maintainer's call, 2026-11-17: a platform break should stop a
  # merge, not wait for the next morning.
  platforms:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: [changes]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux on 24.22.1 is the gate and ui jobs above. Keep these in step
        # with "engines" in package.json, src/core/runtime.ts and platforms.yml.
        include:
          - { os: windows-latest, node: '24.22.1' }
          - { os: windows-latest, node: '26.12.1' }
          - { os: macos-latest, node: '24.22.1' }
          - { os: macos-latest, node: '26.12.1' }
          - { os: ubuntu-latest, node: '26.12.1' }
    env:
      FULL: ${{ needs.changes.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # A Windows runner's temp folder is on C:, where creating and flushing a
      # file is slow enough to time tests out at random; D:, the work disk
      # RUNNER_TEMP is on, is not (#328). os.tmpdir() reads TEMP and TMP.
      - name: Temp folder on the work disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pure
      - if: startsWith(github.head_ref, 'release-please--')
        run: npm run check:dist
      - run: npm run smoke
      - if: env.FULL != 'false'
        run: npm run typecheck -w ui
      - if: env.FULL != 'false'
        run: npm test -w ui
      - if: env.FULL != 'false'
        run: npm run build -w ui
      - if: env.FULL != 'false'
        run: npm run check:package -w ui
      - if: env.FULL != 'false'
        run: npm run smoke -w ui -- --include-tests none

  # The committed dist/toil.js is the last released toil, and only the release
  # PR rebuilds it, so any other PR that changes dist/ fails here. The head
  # branch name reaches the script through env, never the command line.
  dist-guard:
    name: dist/ left to the release PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: node scripts/check-dist.mjs --untouched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}

  # On the release PR only: the release waits while the daily run on every OS is
  # failing. CI checks every OS on every PR, but Toil UI's layout check and the
  # skill install run on Windows and macOS only daily (platforms.yml), and a
  # failed or timed-out daily run keeps a platforms-failure issue open until a
  # daily run passes, which closes it. So an open one means a known break on some
  # OS, and nothing ships over it (principle 8; the maintainer's call,
  # 2026-11-17). Once it closes, re-run this job.
  release-platforms:
    name: No open platforms failure
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open=$(gh issue list --label platforms-failure --state open --json number,url --jq '.[] | "#\(.number) \(.url)"')
          if [ -n "$open" ]; then
            echo "::error::The daily run on Windows, macOS and Linux is failing, so the release waits. Fix the break; the next passing daily run closes the issue (or run platforms.yml on main by hand), then re-run this job. Open: $open"
            exit 1
          fi
          echo "No platforms-failure issue is open."

  # The database providers against real engines (`npm run test:integration`,
  # the `databases` skill). Each server engine is a service container from its
  # official image at a pinned tag, and its URL env var is set, so a target
  # that can't reach its server fails here instead of skipping. Linux only:
  # service containers need a Linux runner, and the providers are plain
  # JavaScript, so the cross-platform gate above covers the rest.
  integration:
    name: Databases (integration)
    needs: [changes]
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # One provider (engine `mysql`) for both, so the suite runs against each.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: mysql
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      # A throwaway server for this job only; its SA password is a test value, in env, not argv.
      # SQLCMDPASSWORD is the same value for the health check's sqlcmd.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Toil-test-Pa55word
          SQLCMDPASSWORD: Toil-test-Pa55word
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s
      # Oracle Database Free. The faststart image ships an already-created
      # database, so it's healthy in about a minute instead of several.
      oracle:
        image: gvenzl/oracle-free:23.26.3-slim-faststart
        env:
          ORACLE_PASSWORD: toil_test_pw
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
      # HiveServer2 with SQL standard authorization, so the hive target has a read-only
      # account to check reads against. It takes any password. 10002 is its web UI, where
      # the target counts running statements; it answers only on its own port number.
      hive:
        image: apache/hive:4.2.1
        env:
          SERVICE_NAME: hiveserver2
          SERVICE_OPTS: >-
            -Dhive.security.authorization.enabled=true
            -Dhive.security.authorization.manager=org.apache.hadoop.hive.ql.security.authorization.plugin.sqlstd.SQLStdHiveAuthorizerFactory
            -Dhive.security.authenticator.manager=org.apache.hadoop.hive.ql.security.SessionStateUserAuthenticator
            -Dhive.users.in.admin.role=hive
        ports: ['10000:10000', '10002:10002']
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/10000'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 20s
    env:
      TOIL_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      TOIL_TEST_MYSQL_URL: mysql://root:mysql@localhost:3306/
      TOIL_TEST_MARIADB_URL: mysql://root:mysql@localhost:3307/
      TOIL_TEST_SQLSERVER_URL: mssql://sa:Toil-test-Pa55word@localhost:1433/master
      TOIL_TEST_ORACLE_URL: oracle://system:toil_test_pw@localhost:1521/FREEPDB1
      TOIL_TEST_HIVE_URL: hive://hive:hive@localhost:10000/?webui=10002
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integration

  # The one check the ruleset on main requires, over both gates (Toil UI's is its
  # checks and its eight layout shards), Windows, macOS and Node 26, and the
  # database integration job, so a regression on any of them blocks a merge. Requiring one job by name, rather than
  # each gate, keeps the ruleset right when jobs change.
  # always() matters: a skipped required check counts as a pass, so this job
  # must run, and fail, when any of them fails. A long job may be skipped only
  # when the scope check itself passed and said full=false; if the scope check
  # fails, the long jobs skip and this fails, so nothing merges unchecked.
  ci-ok:
    name: CI ok
    needs: [changes, gate, ui, ui-layout, platforms, release-platforms, integration, dist-guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The scope check passed
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::The scope check finished as '$RESULT', not 'success'."
            exit 1
          fi
          echo "The scope check passed."
      - name: toil's gate passed
        run: |
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "::error::The gate finished as '${{ needs.gate.result }}', not 'success'."
            exit 1
          fi
          echo "toil's gate passed."
      - name: Toil UI's checks passed
        env:
          RESULT: ${{ needs.ui.result }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$RESULT" = "skipped" ] && [ "$FULL" = "false" ]; then
            echo "Toil UI's checks were skipped: this PR changes only docs and config."
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::Toil UI's checks finished as '$RESULT', not 'success'."
            exit 1
          fi
          echo "Toil UI's checks passed."
      # A matrix job's result is every shard's together: success only when all eight passed.
      - name: Toil UI's layout shards passed
        env:
          RESULT: ${{ needs.ui-layout.result }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$RESULT" = "skipped" ] && [ "$FULL" = "false" ]; then
            echo "Toil UI's layout shards were skipped: this PR changes only docs and config."
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::Toil UI's layout shards finished as '$RESULT', not 'success'."
            exit 1
          fi
          echo "Toil UI's layout shards passed."
      # Skipped only when the scope check failed, which fails above; toil's gate
      # runs on every OS on every PR, so only success passes. On a docs-and-config
      # PR the jobs skip Toil UI's steps, and this says so rather than claim them.
      - name: Windows, macOS and Node 26 passed
        env:
          RESULT: ${{ needs.platforms.result }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::The Windows, macOS and Node 26 jobs finished as '$RESULT', not 'success'."
            exit 1
          fi
          if [ "$FULL" = "false" ]; then
            echo "toil's gate passed on Windows, macOS and Node 26; Toil UI's steps were skipped there: this PR changes only docs and config."
            exit 0
          fi
          echo "Windows, macOS and Node 26 passed."
      # Runs only on the release PR; anywhere else a skip is expected.
      - name: No open platforms failure on the release PR
        env:
          RESULT: ${{ needs.release-platforms.result }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release-please--*) ;;
            *) echo "Not the release PR: the open platforms-failure check doesn't apply."; exit 0 ;;
          esac
          if [ "$RESULT" != "success" ]; then
            echo "::error::The open platforms-failure check finished as '$RESULT', not 'success'."
            exit 1
          fi
          echo "No platforms-failure issue is open."
      - name: The database integration job passed
        env:
          RESULT: ${{ needs.integration.result }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$RESULT" = "skipped" ] && [ "$FULL" = "false" ]; then
            echo "The integration job was skipped: this PR changes only docs and config."
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::The integration job finished as '$RESULT', not 'success'."
            exit 1
          fi
          echo "The database integration job passed."
      # Skipped on a push to main, where there is no base to compare with.
      - name: The dist/ guard passed
        run: |
          if [ "${{ needs.dist-guard.result }}" != "success" ] && [ "${{ needs.dist-guard.result }}" != "skipped" ]; then
            echo "::error::The dist/ guard finished as '${{ needs.dist-guard.result }}'."
            exit 1
          fi
          echo "dist/ was left to the release PR."
